server {
    listen 8000;
    server_name _;
    root /var/www/html/public;

    index index.php;

    charset utf-8;

    # Texturepacks .pack файлы из клиента PZ часто 500 MB - 2 GB каждый,
    # uploadим pack'ами по нескольку штук → ставим 4 GB лимит.
    client_max_body_size 4g;
    client_body_timeout 600s;

    # Compress cell-binary responses on the fly. lotpack/lotheader contain
    # lots of zero bytes and repeated sprite indices — gzip cuts payload
    # ~3-5×. application/octet-stream is the Content-Type of bulk endpoint
    # and the per-cell endpoints, so this catches all of them.
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/octet-stream application/json text/plain;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Map tiles — bypass PHP, serve directly from the mounted volume so Leaflet
    # can request hundreds of tiles per pan/zoom without saturating PHP-FPM.
    location /map-tiles/ {
        alias /map-tiles/html/map_data/base/layer0_files/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # WebGL renderer atlas — large WebP files. Atlas contents are PZ texture
    # sprites (the same ones any owner of the game already has); cell binary
    # data which actually reflects server state is still served via Laravel.
    # PHP-FPM has no business touching the 200-300 MB atlas, so we serve it
    # statically from /pz-atlas/ (separate URL prefix to keep the route table
    # honest about what bypasses auth).
    # Multi-LOD atlas pages — atlas-{version}-{pageId}-lod{L}.{webp|ktx2}. The
    # legacy single-LOD pattern (atlas-{version}-{pageId}.webp) is preserved
    # so a frontend built against the old manifest still works during a
    # rolling upgrade.
    location ~ ^/pz-atlas/atlas-([A-Za-z0-9_.-]+)\.(webp|ktx2)$ {
        alias /map-tiles/web/atlas-$1.$2;
        access_log off;
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /pz-atlas/sprites.json {
        alias /map-tiles/web/sprites.json;
        access_log off;
        add_header Cache-Control "public, max-age=86400";
        gzip_static on;
    }

    # Atlas manifest содержит version hash который меняется при rebuild —
    # его нельзя кешировать в disk cache браузера, иначе клиент будет видеть
    # старую версию атласа. no-cache (но с ETag/Last-Modified) заставляет
    # браузер revalidate каждый раз через 304-handshake.
    location = /pz-atlas/manifest.json {
        alias /map-tiles/web/manifest.json;
        access_log off;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # cell-pages.json — sparse map cellX_cellY → [atlas page IDs]. Optional
    # artifact; the frontend falls back gracefully when absent.
    location = /pz-atlas/cell-pages.json {
        alias /map-tiles/web/cell-pages.json;
        access_log off;
        gzip_static on;
        add_header Cache-Control "public, max-age=86400";
    }

    # Pre-packed PZ cell binaries — built by `php artisan zomboid:build-cell-archives`.
    # Each chunk groups 8×8 cells (≤64 cells, ~5-7 MB gz). nginx serves the
    # .gz file automatically via gzip_static when the browser sends
    # Accept-Encoding: gzip, otherwise falls back to the raw .bin. Files are
    # immutable per PZ-version (re-run the artisan command after a PZ patch).
    location ~ ^/pz-cell-data/(.+)$ {
        alias /map-tiles/cell-data/$1;
        access_log off;
        gzip_static on;
        # Single Cache-Control header — `expires` would add a second one
        # and some browsers ignore both when they disagree.
        add_header Cache-Control "public, max-age=31536000, immutable";
        default_type application/octet-stream;
    }

    location = /pz-cell-data/index.json {
        alias /map-tiles/cell-data/index.json;
        access_log off;
        gzip_static on;
        add_header Cache-Control "public, max-age=300";
        default_type application/json;
    }

    # Save-game packed cells — built by `php artisan pz:rebuild-save-cache`
    # (scheduled every 30s). Per-cell .packed файлы и общий manifest.json.
    # nginx обслуживает напрямую с Last-Modified — браузер на reload получает
    # 304 для неизменённых cells.
    location = /pz-save-data/manifest.json {
        alias /map-tiles/save-cache/manifest.json;
        access_log off;
        add_header Cache-Control "private, max-age=5, must-revalidate";
        default_type application/json;
        error_page 404 = @save_cell_not_found;
    }

    location ~ ^/pz-save-data/(cell-\d+_\d+\.(?:l\d+\.(?:packed|strides)|mask))$ {
        alias /map-tiles/save-cache/$1;
        access_log off;
        add_header Cache-Control "public, max-age=300, must-revalidate";
        default_type application/octet-stream;
        error_page 404 = @save_cell_not_found;
    }

    location @save_cell_not_found {
        return 404;
    }

    # WebGL cell binaries — bypass PHP entirely. The bottleneck was that 5
    # PHP-FPM workers boot Laravel (~50 ms each) on every cell request, capping
    # us at ~100 req/sec while a fresh viewport bursts 500-1000 requests.
    # nginx static file serving handles this at ~50000 req/sec.
    # PZ map binaries are not secret (the game ships them to every player), so
    # bypassing the auth middleware here is acceptable. @@PZ_MAP_NAME@@ and
    # @@PZ_SERVER_NAME@@ are substituted at container start by entrypoint.sh.
    # Cell binary 404s must NOT redirect to /index.php (the global error_page
    # below). The named location below short-circuits with a plain 404 — the
    # frontend treats this as "cell doesn't exist on disk" and caches the
    # result in its missing-cells set.
    location @cell_not_found {
        return 404;
    }

    location ~ ^/admin/api/pz-map/cell/(\d+)/(\d+)/header$ {
        alias "/pz-server/media/maps/@@PZ_MAP_NAME@@/$1_$2.lotheader";
        access_log off;
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=300";
        error_page 404 = @cell_not_found;
    }

    location ~ ^/admin/api/pz-map/cell/(\d+)/(\d+)/lotpack$ {
        alias "/pz-server/media/maps/@@PZ_MAP_NAME@@/world_$1_$2.lotpack";
        access_log off;
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=3600";
        error_page 404 = @cell_not_found;
    }

    location ~ ^/admin/api/pz-map/cell/(\d+)/(\d+)/save$ {
        alias "/pz-data/Saves/Multiplayer/@@PZ_SERVER_NAME@@/map/$1/$2.bin";
        access_log off;
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=300";
        error_page 404 = @cell_not_found;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        fastcgi_buffer_size 32k;
        fastcgi_buffers 8 16k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
